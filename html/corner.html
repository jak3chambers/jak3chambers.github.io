<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corner</title>
<style>
  :root {
    color-scheme: dark;
    --blue: #42a5de;
    --orange: #ffad42;
    --navy: #1f3448;
    --ink: #172635;
  }

  * { box-sizing: border-box; }

  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    background: #1f3448 url("media/thekip.png") center / cover fixed no-repeat;
    font-family: "Comic Sans MS", "Comic Sans", cursive;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(31, 52, 72, 0.62);
    pointer-events: none;
  }

  .keypad {
    position: relative;
    width: min(100%, 340px);
    padding: 16px;
    border: 1px solid rgba(123, 206, 239, 0.75);
    border-radius: 8px;
    background: rgba(31, 52, 72, 0.96);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
  }

  #entry {
    display: block;
    width: 100%;
    height: 58px;
    margin-bottom: 12px;
    padding: 8px 12px;
    border: 1px solid rgba(123, 206, 239, 0.6);
    border-radius: 6px;
    background: #172635;
    color: #f4f8fc;
    font: 24px/1.2 monospace;
    text-align: right;
    outline: none;
  }

  #entry:focus-visible {
    border-color: var(--blue);
    box-shadow: 0 0 0 2px rgba(66, 165, 222, 0.35);
  }

  .keys {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
  }

  .keys button {
    min-width: 0;
    height: 60px;
    border: 1px solid #e9942f;
    border-bottom-color: #c97a1c;
    border-radius: 6px;
    background: var(--orange);
    box-shadow: 0 2px 0 #142638;
    color: var(--ink);
    font: 700 24px/1 monospace;
    cursor: pointer;
    touch-action: manipulation;
  }

  .keys button:hover { background: #ffc266; }
  .keys button:active { transform: translateY(1px); box-shadow: 0 1px 0 #142638; }
  .keys button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .keys button[data-digit="0"] { grid-column: 2; }
</style>
</head>
<body>
  <main class="keypad">
    <input id="entry" type="text" aria-label="Entry" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="keys" role="group" aria-label="Number keys">
      <button type="button" data-digit="1">1</button>
      <button type="button" data-digit="2">2</button>
      <button type="button" data-digit="3">3</button>
      <button type="button" data-digit="4">4</button>
      <button type="button" data-digit="5">5</button>
      <button type="button" data-digit="6">6</button>
      <button type="button" data-digit="7">7</button>
      <button type="button" data-digit="8">8</button>
      <button type="button" data-digit="9">9</button>
      <button type="button" data-digit="0">0</button>
    </div>
  </main>
<script>
  const entry = document.getElementById('entry');
  document.querySelectorAll('[data-digit]').forEach((button) => {
    button.addEventListener('click', () => {
      const start = entry.selectionStart ?? entry.value.length;
      const end = entry.selectionEnd ?? entry.value.length;
      entry.setRangeText(button.dataset.digit, start, end, 'end');
      entry.focus();
    });
  });
</script>
</body>
</html>
