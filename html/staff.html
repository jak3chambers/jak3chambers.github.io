<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff</title>
<style>
  :root {
    --blue: #42a5de;
    --orange: #ffad42;
    --navy: #1f3448;
    --ink: #172635;
  }
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; color: var(--navy); background: var(--blue); font-family: "Comic Sans MS", "Comic Sans", cursive; }
  #message-creatures { position: fixed; inset: 0; z-index: 1; pointer-events: none; filter: contrast(0.9) saturate(0.92); }
  header, main { position: relative; z-index: 2; }
  header { display: flex; justify-content: flex-end; padding: 8px; }
  #page-nav { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; border: 1px dashed #7bceef; background: var(--orange); }
  #page-nav a, #page-nav span { border: 1px solid #237eae; padding: 2px 10px; color: var(--ink); background: var(--blue); font-size: 16px; text-decoration: none; }
  #page-nav a:hover { background: #70bee9; }
  main { width: min(calc(100% - 32px), 940px); min-height: calc(100vh - 80px); margin: 0 auto 24px; padding: 32px; border: 1px solid #237eae; border-top: 0; border-radius: 0 0 8px 8px; background: var(--orange); }
  h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.15; }
  .intro { margin: 0 0 22px; color: #4a351d; line-height: 1.5; }
  h2 { margin: 28px 0 12px; font-size: 19px; }

  /* Employee of the month */
  #eotm { display: flex; align-items: center; gap: 20px; padding: 18px; border: 3px double var(--navy); border-radius: 8px; background: #fff3d6; }
  #eotm .photo { flex: 0 0 150px; width: 150px; height: 150px; border: 3px solid var(--navy); border-radius: 6px; }
  #eotm .eotm-label { margin: 0; color: #8a5a10; font: 700 15px monospace; letter-spacing: .08em; text-transform: uppercase; }
  #eotm .eotm-name { margin: 2px 0; font-size: 26px; }
  #eotm .eotm-title { margin: 0 0 6px; font-weight: 700; }
  #eotm p { margin: 0; line-height: 1.45; }
  #eotm.empty { justify-content: center; text-align: center; padding: 26px 18px; }

  /* Staff grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .card { display: flex; flex-direction: column; border: 1px solid #237eae; border-radius: 6px; background: var(--blue); box-shadow: 0 3px 0 rgba(31, 52, 72, .35); overflow: hidden; }
  .card .photo { width: 100%; aspect-ratio: 1 / 1; }
  .photo { display: block; object-fit: cover; background: #7bceef; }
  div.photo { display: grid; place-items: center; color: var(--navy); font-size: 56px; font-weight: 700; }
  .card-body { display: flex; flex: 1; flex-direction: column; gap: 4px; padding: 12px; }
  .card h3 { margin: 0; font-size: 17px; }
  .card .job { margin: 0; color: #12384f; font-size: 16px; font-weight: 700; }
  .card .desc { flex: 1; margin: 4px 0 8px; color: #102b3e; font-size: 16px; line-height: 1.4; }
  .vote-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .votes { color: #12384f; font: 15px monospace; }
  button { border: 1px solid #e9942f; border-bottom-color: #c97a1c; border-radius: 5px; padding: 7px 11px; background: var(--orange); color: var(--ink); font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
  button:hover { background: #ffc266; }
  button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  button:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  .note { margin: 22px 0 0; color: #563d20; font-size: 15px; line-height: 1.5; }

  @media (max-width: 560px) {
    main { width: calc(100% - 16px); padding: 22px 16px; }
    #eotm { flex-direction: column; text-align: center; }
  }
</style>
<link rel="stylesheet" href="css/site-text.css">
</head>
<body>
  <header><nav id="page-nav"></nav></header>
  <main>
    <h1 id="title"></h1>
    <p class="intro" id="intro"></p>

    <section aria-labelledby="eotm-heading">
      <h2 id="eotm-heading"></h2>
      <div id="eotm"></div>
    </section>

    <h2 id="staff-heading"></h2>
    <div id="grid"></div>
    <p class="note" id="note"></p>
    <p class="note" id="credit">
      <span id="credit-prefix"></span>
      <a href="https://gitlab.com/cable-mc/cobblemon-assets/-/tree/master/blockbench/pokemon/gen3/0258_mudkip" target="_blank" rel="noopener noreferrer">Cobblemon Assets contributors</a><span id="credit-mid"></span>
      <a href="https://creativecommons.org/licenses/by-nc/3.0/" target="_blank" rel="noopener noreferrer">CC BY-NC 3.0</a>.
    </p>
  </main>

<script src="js/nav.js"></script>
<script src="config/staff-config.js"></script>
<script src="config/firebase-config.js"></script>
<script src="js/site-db.js"></script>
<script>
(function () {
  'use strict';
  var lang = window.SITE_NAV.language;
  var ca = lang === 'ca';
  document.documentElement.lang = lang;
  window.SITE_NAV.build(document.getElementById('page-nav'), 'staff', lang);

  var T = ca ? {
    title: 'Personal', intro: 'Coneix l\'equip. Tots són molt professionals.',
    eotm: 'Empleat del mes', staff: 'Tot el personal',
    vote: 'Vota', voted: 'Votat ✓', votes: function (n) { return n === 1 ? '1 vot' : n + ' vots'; },
    none: 'Encara no hi ha cap empleat del mes. Vota algú a sota!',
    badge: 'Empleat del mes',
    note: 'Un vot per mes. Els vots només es compten en aquest navegador i es reinicien cada mes.',
    credit: 'Geometria i textura de Mudkip de ', creditMid: '; renderitzat amb Three.js sota la llicència ',
    locale: 'ca-ES'
  } : {
    title: 'Staff', intro: 'Meet the team. They are all extremely professional.',
    eotm: 'Employee of the Month', staff: 'All staff',
    vote: 'Vote', voted: 'Voted ✓', votes: function (n) { return n === 1 ? '1 vote' : n + ' votes'; },
    none: 'No employee of the month yet. Vote for someone below!',
    badge: 'Employee of the month',
    note: 'One vote per month. Votes are only counted in this browser and reset every month.',
    credit: 'Mudkip geometry and texture from ', creditMid: '; rendered in Three.js under ',
    locale: 'en-US'
  };
  document.title = T.title;
  document.getElementById('title').textContent = T.title;
  document.getElementById('intro').textContent = T.intro;
  document.getElementById('eotm-heading').textContent = T.eotm;
  document.getElementById('staff-heading').textContent = T.staff;
  document.getElementById('note').textContent = T.note;
  document.getElementById('credit-prefix').textContent = T.credit;
  document.getElementById('credit-mid').textContent = T.creditMid;

  var STORE = 'staffVoteV1';
  var now = new Date();
  var monthKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  var monthName = new Intl.DateTimeFormat(T.locale, { month: 'long', year: 'numeric' }).format(now);

  var employees = (window.STAFF_CONFIG && window.STAFF_CONFIG.employees || []).map(function (e, i) {
    var text = (ca && e.ca) || {};
    return {
      id: i,
      name: e.name || '',
      image: e.image || '',
      title: text.title || e.title || '',
      description: text.description || e.description || '',
      baseVotes: Number(e.votes) || 0
    };
  });

  function getChoice() {
    try {
      var data = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (data && data.month === monthKey && typeof data.id === 'number') return data.id;
    } catch (_) {}
    return null;
  }
  function setChoice(id) {
    try {
      if (id === null) localStorage.removeItem(STORE);
      else localStorage.setItem(STORE, JSON.stringify({ month: monthKey, id: id }));
    } catch (_) {}
  }
  // Shared votes (when config/firebase-config.js is filled in): counts come from Firestore.
  // Each browser remembers its own pick so you can see it, change it, or take it back.
  var remote = !!(window.SiteDB && window.SiteDB.enabled);
  var counts = {};
  function loadCounts() {
    if (!remote) return Promise.resolve();
    return window.SiteDB.list('votes').then(function (docs) {
      var data = {};
      docs.forEach(function (doc) {
        var parts = doc.id.split('_');
        if (parts[0] === monthKey && typeof doc.count === 'number') data[Number(parts[1])] = Math.max(0, doc.count);
      });
      counts = data;
      render();
    }).catch(function () {});
  }
  function tally(e) {
    if (remote) return e.baseVotes + (counts[e.id] || 0);
    return e.baseVotes + (getChoice() === e.id ? 1 : 0);
  }
  function castVote(e) {
    var previous = getChoice();
    var next = previous === e.id ? null : e.id;
    setChoice(next);
    if (remote) {
      var changes = [];
      if (previous !== null) changes.push({ collection: 'votes', id: monthKey + '_' + previous, field: 'count', delta: -1 });
      if (next !== null) changes.push({ collection: 'votes', id: monthKey + '_' + next, field: 'count', delta: 1 });
      if (previous !== null) counts[previous] = Math.max(0, (counts[previous] || 0) - 1);
      if (next !== null) counts[next] = (counts[next] || 0) + 1;
      render();
      window.SiteDB.increment(changes).catch(function () {
        setChoice(previous);   // the vote did not go through: put things back
        return loadCounts();
      }).then(render);
      return;
    }
    render();
  }

  function makePhoto(e) {
    function placeholder() {
      var d = document.createElement('div');
      d.className = 'photo';
      d.textContent = (e.name.trim()[0] || '?').toUpperCase();
      return d;
    }
    if (!e.image) return placeholder();
    var img = document.createElement('img');
    img.className = 'photo';
    img.src = e.image;
    img.alt = e.name;
    img.addEventListener('error', function () { img.replaceWith(placeholder()); });
    return img;
  }

  function renderEotm() {
    var box = document.getElementById('eotm');
    box.replaceChildren();
    var best = null;
    employees.forEach(function (e) { if (tally(e) > 0 && (!best || tally(e) > tally(best))) best = e; });
    box.classList.toggle('empty', !best);
    if (!best) { box.textContent = T.none; return; }
    var text = document.createElement('div');
    var label = document.createElement('p'); label.className = 'eotm-label'; label.textContent = T.badge + ' · ' + monthName;
    var name = document.createElement('h3'); name.className = 'eotm-name'; name.textContent = best.name;
    var job = document.createElement('p'); job.className = 'eotm-title'; job.textContent = best.title;
    var desc = document.createElement('p'); desc.textContent = best.description;
    text.append(label, name, job, desc);
    box.append(makePhoto(best), text);
  }

  function renderGrid() {
    var grid = document.getElementById('grid');
    grid.replaceChildren();
    var choice = getChoice();
    employees.forEach(function (e) {
      var card = document.createElement('article'); card.className = 'card';
      var body = document.createElement('div'); body.className = 'card-body';
      var name = document.createElement('h3'); name.textContent = e.name;
      var job = document.createElement('p'); job.className = 'job'; job.textContent = e.title;
      var desc = document.createElement('p'); desc.className = 'desc'; desc.textContent = e.description;
      var row = document.createElement('div'); row.className = 'vote-row';
      var count = document.createElement('span'); count.className = 'votes'; count.textContent = T.votes(tally(e));
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = choice === e.id ? T.voted : T.vote;
      btn.setAttribute('aria-pressed', choice === e.id ? 'true' : 'false');
      btn.addEventListener('click', function () { castVote(e); });
      row.append(count, btn);
      body.append(name, job, desc, row);
      card.append(makePhoto(e), body);
      grid.append(card);
    });
  }

  function render() { renderEotm(); renderGrid(); }
  render();
  if (remote) {
    loadCounts();
    setInterval(loadCounts, 60000);
  }
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/mudkip-model.js"></script>
<script src="js/mudkips.js"></script>
</body>
</html>
