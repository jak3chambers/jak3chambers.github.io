<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
(function () {
  var requested = new URLSearchParams(location.search).get('lang');
  var saved = null;
  try { saved = localStorage.getItem('chambersCatLanguage'); } catch (_) {}
  var languages = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
  var detected = languages.some(function (language) { return /^ca(?:-|$)/i.test(language); }) ? 'ca' : 'en';
  var language = requested === 'ca' || requested === 'en' ? requested : saved || detected;
  window.PAGE_LANGUAGE = language;
  document.documentElement.lang = language;
  if (requested === 'ca' || requested === 'en') {
    try { localStorage.setItem('chambersCatLanguage', language); } catch (_) {}
  }
})();
</script>
<title>I was here</title>
<style>
  :root {
    color-scheme: light;
    /* THEME: steel blue / navy / sky / plum / ice */
    --steel: #5a82a6;
    --navy: #2c4d6b;
    --sky: #a7cce8;
    --plum: #4b2c6b;
    --ice: #e3f1ff;
    --blue: var(--steel);
    --orange: var(--ice);
    --ink: var(--navy);
    --muted: #3d5f7d;
  }

  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    color: var(--navy);
    background: var(--blue);
    font-family: "Comic Sans MS", "Comic Sans", cursive;
  }
  header, main { position: relative; z-index: 2; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 8px;
    background: transparent;
  }
  nav { display: flex; align-items: center; gap: 14px; }
  .language {
    gap: 6px;
    padding: 4px 8px;
    border: 1px solid #2a4560;
    border-radius: 4px;
    background: rgba(31, 52, 72, 0.94);
    color: var(--orange);
    font: 15px/1.2 monospace;
  }
  .language a { color: inherit; text-decoration: none; }
  .language a:hover { color: #fff; }
  .language [aria-current="page"] { color: #fff; font-weight: 700; }
  #page-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; padding: 8px; border: 1px dashed var(--sky); background: var(--navy); }
  #page-nav a, #page-nav span { border: 1px solid var(--sky); padding: 2px 10px; color: var(--navy); background: var(--sky); font-size: 16px; text-decoration: none; }
  #page-nav a:hover { background: #fff; }
  #page-nav span[aria-current] { background: var(--plum); border-color: var(--plum); color: #fff; font-weight: 700; }
  main {
    position: relative;
    z-index: 1;
    width: min(calc(100% - 32px), 880px);
    min-height: calc(100vh - 80px);
    margin: 0 auto 24px;
    padding: 32px;
    border: 1px solid var(--navy);
    border-top: 0;
    border-radius: 0 0 8px 8px;
    background: var(--orange);
  }
  h1 { margin: 0; color: var(--navy); font-size: 30px; line-height: 1.15; }
  .intro { margin: 10px 0 22px; color: var(--muted); line-height: 1.5; }
  .local-note { max-width: 720px; padding-left: 12px; border-left: 3px solid var(--blue); }
  #message-form { display: grid; gap: 12px; margin: 14px 0 24px; padding: 16px; border: 1px solid rgba(31, 52, 72, 0.3); border-radius: 6px; background: rgba(167, 204, 232, 0.45); }
  #message-form[hidden] { display: none; }
  label { display: grid; gap: 6px; color: var(--navy); font-size: 16px; }
  input, textarea {
    width: 100%;
    border: 1px solid rgba(31, 52, 72, 0.42);
    border-radius: 5px;
    padding: 10px 12px;
    background: #fffdf8;
    color: var(--navy);
    font: inherit;
    font-size: 16px;
    line-height: 1.45;
  }
  textarea { min-height: 112px; resize: vertical; }
  input:focus-visible, textarea:focus-visible { outline: 2px solid var(--plum); outline-offset: 2px; }
  .form-actions { display: flex; align-items: center; gap: 12px; }
  button {
    border: 1px solid var(--plum);
    border-bottom-color: #321b49;
    border-radius: 5px;
    padding: 9px 14px;
    background: var(--plum);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #633a8c; }
  button:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }
  #make-message { padding: 6px 10px; border-color: var(--steel); background: var(--sky); color: var(--navy); font-size: 15px; }
  #make-message:hover { background: #fff; }
  .text-button { border-color: transparent; background: transparent; color: var(--navy); }
  .text-button:hover { background: rgba(31, 52, 72, 0.08); }
  #status { min-height: 1.4em; margin: 0; color: var(--muted); font-size: 16px; }
  .messages-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-top: 26px; }
  h2 { margin: 0; color: var(--navy); font-size: 19px; }
  #message-count { color: var(--muted); font: 15px monospace; }
  #messages { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; margin-top: 12px; align-items: start; }
  .message { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; min-height: 132px; padding: 14px; border: 1px solid var(--steel); border-radius: 6px; background: var(--sky); box-shadow: 0 3px 0 rgba(31, 52, 72, 0.35); }
  .message-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
  .message-author { color: var(--navy); font-size: 16px; font-weight: 700; }
  .message-date { color: #3d5f7d; font: 14px monospace; }
  .message-body { grid-column: 1 / -1; margin: 0; color: #102b3e; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
  .delete-message { grid-column: 2; grid-row: 1; align-self: start; padding: 5px 8px; font-size: 14px; }
  .empty-state { grid-column: 1 / -1; padding: 20px 0; color: var(--muted); }

  #owner-area { margin-top: 28px; padding-top: 10px; border-top: 1px dashed rgba(31, 52, 72, 0.3); }
  #owner-form { display: grid; gap: 10px; max-width: 320px; margin-top: 8px; }
  #owner-form[hidden] { display: none; }
  #owner-status { min-height: 1.2em; margin: 0; color: var(--muted); font-size: 16px; }

  @media (max-width: 520px) {
    header { align-items: flex-start; }
    main { width: calc(100% - 16px); min-height: calc(100vh - 72px); margin-bottom: 16px; padding: 24px 18px; }
    h1 { font-size: 26px; }
    .messages-heading { align-items: center; }
    .message { gap: 6px 8px; }
  }
</style>
<link rel="stylesheet" href="css/site-text.css">
</head>
<body>
  <header>
    <nav id="page-nav"></nav>
  </header>

  <main>
    <h1 id="page-title">Leave a trace</h1>
    <p id="intro" class="intro local-note"></p>

    <div class="messages-heading">
      <h2 id="messages-heading">The wall</h2>
      <span id="message-count"></span>
    </div>
    <div class="form-actions">
      <button id="make-message" type="button">Sign the wall</button>
      <button id="clear-button" class="text-button" type="button">Clear all</button>
    </div>

    <form id="message-form" hidden>
      <label>
        <span id="name-label">Name</span>
        <input id="author" type="text" autocomplete="nickname" maxlength="40" required>
      </label>
      <label>
        <span id="message-label">Message</span>
        <textarea id="message-body" maxlength="500" required></textarea>
      </label>
      <div class="form-actions">
        <button id="post-button" type="submit">Post message</button>
        <button id="cancel-message" class="text-button" type="button">Cancel</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </form>

    <section aria-labelledby="messages-heading">
      <div id="messages" aria-live="polite"></div>
    </section>

    <div id="owner-area" hidden>
      <button id="owner-toggle" class="text-button" type="button">Owner</button>
      <form id="owner-form" hidden>
        <label><span id="owner-email-label">Email</span><input id="owner-email" type="email" autocomplete="username"></label>
        <label><span id="owner-password-label">Password</span><input id="owner-password" type="password" autocomplete="current-password"></label>
        <div class="form-actions"><button id="owner-login" type="submit">Log in</button></div>
        <p id="owner-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>

<script src="js/nav.js"></script>
<script src="config/firebase-config.js"></script>
<script src="js/site-db.js"></script>
<script>
  const isCatalan = window.PAGE_LANGUAGE === 'ca';
  const copy = isCatalan ? {
    title: 'Hi vaig ser aquí', pageHeading: 'Deixa un rastre', make: 'Signa el mur', cancel: 'Cancel·la',
    introLocal: 'Escriu el teu nom i una línia. Un missatge per nom. Per ara el mur només viu en aquest navegador: ningú més el pot veure encara.',
    introShared: 'Escriu el teu nom i una línia. Un missatge per nom. Tothom qui visiti la pàgina veu el mur.',
    name: 'Nom', message: 'Missatge', post: 'Publica el missatge', clear: 'Esborra-ho tot',
    heading: 'El mur', empty: 'Encara no hi ha cap missatge.', loading: 'Carregant el mur…',
    duplicate: 'Ja hi ha un missatge amb aquest nom. Tria un altre nom.',
    count: n => n === 1 ? '1 missatge' : n + ' missatges', anonymous: 'Anònim',
    delete: 'Esborra', blocked: 'El missatge conté llenguatge ofensiu i no s’ha publicat.', confirm: 'Vols esborrar tots els missatges d’aquest navegador?',
    saved: 'Missatge publicat.', removed: 'Missatge esborrat.', cleared: 'S’han esborrat tots els missatges.',
    storageError: 'No s’ha pogut desar. Potser l’emmagatzematge del navegador és ple.',
    loadError: 'No s’ha pogut carregar el mur. Torna-ho a provar d’aquí una estona.',
    postError: 'No s’ha pogut publicar el missatge. Torna-ho a provar.',
    owner: 'Propietari', email: 'Correu', password: 'Contrasenya', login: 'Entra', logout: 'Surt',
    loginError: 'No s’ha pogut entrar. Comprova el correu i la contrasenya.', loggedIn: 'Has entrat. Ja pots esborrar missatges.',
    dateLocale: 'ca-ES'
  } : {
    title: 'I was here', pageHeading: 'Leave a trace', make: 'Sign the wall', cancel: 'Cancel',
    introLocal: 'Write your name and a line. One message per name. For now the wall only lives in this browser: nobody else can see it yet.',
    introShared: 'Write your name and a line. One message per name. Everyone who visits sees the wall.',
    name: 'Name', message: 'Message', post: 'Post message', clear: 'Clear all',
    heading: 'The wall', empty: 'No messages yet.', loading: 'Loading the wall…',
    duplicate: 'A message with that name is already on the wall. Pick another name.',
    count: n => n === 1 ? '1 message' : n + ' messages', anonymous: 'Anonymous',
    delete: 'Delete', blocked: 'This message contains blocked language and was not posted.', confirm: 'Clear all messages saved in this browser?',
    saved: 'Message posted.', removed: 'Message deleted.', cleared: 'All messages cleared.',
    storageError: 'Could not save. Browser storage may be full.',
    loadError: 'Could not load the wall. Try again in a bit.',
    postError: 'Could not post your message. Try again.',
    owner: 'Owner', email: 'Email', password: 'Password', login: 'Log in', logout: 'Log out',
    loginError: 'Could not log in. Check the email and password.', loggedIn: 'Logged in. You can delete messages now.',
    dateLocale: 'en-US'
  };

  const remote = !!(window.SiteDB && window.SiteDB.enabled);

  document.title = copy.title;
  document.getElementById('page-title').textContent = copy.pageHeading;
  window.SITE_NAV.build(document.getElementById('page-nav'), 'messages', window.PAGE_LANGUAGE);
  document.getElementById('intro').textContent = remote ? copy.introShared : copy.introLocal;
  document.getElementById('name-label').textContent = copy.name;
  document.getElementById('message-label').textContent = copy.message;
  document.getElementById('post-button').textContent = copy.post;
  document.getElementById('clear-button').textContent = copy.clear;
  document.getElementById('messages-heading').textContent = copy.heading;
  document.getElementById('make-message').textContent = copy.make;
  document.getElementById('cancel-message').textContent = copy.cancel;
  document.getElementById('owner-email-label').textContent = copy.email;
  document.getElementById('owner-password-label').textContent = copy.password;
  document.getElementById('owner-login').textContent = copy.login;

  const storageKey = 'chambersCatMessagesV1';
  const messagesElement = document.getElementById('messages');
  const countElement = document.getElementById('message-count');
  const statusElement = document.getElementById('status');
  const ownerToggle = document.getElementById('owner-toggle');
  const ownerForm = document.getElementById('owner-form');
  const ownerStatus = document.getElementById('owner-status');
  let messages = [];

  const nameKey = name => window.SiteDB.nameKey(name);
  const containsBlockedLanguage = text => window.SiteDB.isBlocked(text);

  // Who sees Delete buttons: everyone in local mode (it is only their own browser),
  // only the logged-in owner on the shared wall.
  const canDelete = () => !remote || window.SiteDB.isOwner();

  document.getElementById('make-message').addEventListener('click', () => {
    document.getElementById('message-form').hidden = false;
    document.getElementById('author').focus();
  });
  document.getElementById('cancel-message').addEventListener('click', () => {
    const form = document.getElementById('message-form');
    form.reset();
    form.hidden = true;
    statusElement.textContent = '';
  });

  function saveLocal() {
    try {
      localStorage.setItem(storageKey, JSON.stringify(messages));
      return true;
    } catch (_) {
      statusElement.textContent = copy.storageError;
      return false;
    }
  }

  function loadMessages() {
    if (!remote) {
      try {
        const stored = JSON.parse(localStorage.getItem(storageKey) || '[]');
        if (Array.isArray(stored)) messages = stored.filter(item => item && typeof item.id === 'string' && typeof item.body === 'string');
      } catch (_) {
        statusElement.textContent = copy.storageError;
      }
      render();
      return Promise.resolve();
    }
    return window.SiteDB.list('messages', 'createdAt').then(docs => {
      messages = docs
        .filter(doc => typeof doc.body === 'string' && typeof doc.createdAt === 'number')
        .map(doc => ({ id: doc.id, author: doc.name || '', body: doc.body, createdAt: new Date(doc.createdAt).toISOString() }))
        .sort((a, b) => a.createdAt < b.createdAt ? -1 : 1);
      render();
    }).catch(() => {
      countElement.textContent = '';
      messagesElement.replaceChildren();
      const failed = document.createElement('p');
      failed.className = 'empty-state';
      failed.textContent = copy.loadError;
      messagesElement.append(failed);
    });
  }

  function render() {
    messagesElement.replaceChildren();
    countElement.textContent = copy.count(messages.length);
    if (!messages.length) {
      const empty = document.createElement('p');
      empty.className = 'empty-state';
      empty.textContent = copy.empty;
      messagesElement.append(empty);
      return;
    }

    messages.slice().reverse().forEach(message => {
      const article = document.createElement('article');
      article.className = 'message';
      const meta = document.createElement('div');
      meta.className = 'message-meta';
      const author = document.createElement('strong');
      author.className = 'message-author';
      author.textContent = message.author || copy.anonymous;
      const date = document.createElement('time');
      date.className = 'message-date';
      const parsedDate = new Date(message.createdAt);
      date.dateTime = parsedDate.toISOString();
      date.textContent = new Intl.DateTimeFormat(copy.dateLocale, { dateStyle: 'medium', timeStyle: 'short' }).format(parsedDate);
      const body = document.createElement('p');
      body.className = 'message-body';
      body.textContent = message.body;
      meta.append(author, date);
      article.append(meta, body);
      if (canDelete()) {
        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete-message';
        remove.dataset.deleteId = message.id;
        remove.textContent = copy.delete;
        remove.setAttribute('aria-label', copy.delete + ': ' + (message.author || copy.anonymous));
        article.append(remove);
      }
      messagesElement.append(article);
    });
  }

  function finishPost(form) {
    form.reset();
    statusElement.textContent = copy.saved;
    form.hidden = true;
    render();
  }

  document.getElementById('message-form').addEventListener('submit', event => {
    event.preventDefault();
    const form = event.currentTarget;
    const body = document.getElementById('message-body').value.trim();
    if (!body) return;
    const author = document.getElementById('author').value.replace(/\s+/g, ' ').trim();
    if (!author) return;
    if (containsBlockedLanguage(body) || containsBlockedLanguage(author)) {
      statusElement.textContent = copy.blocked;
      return;
    }
    if (messages.some(message => nameKey(message.author || '') === nameKey(author))) {
      statusElement.textContent = copy.duplicate;
      return;
    }

    if (!remote) {
      messages.push({ id: crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2), author, body, createdAt: new Date().toISOString() });
      if (!saveLocal()) { messages.pop(); return; }
      finishPost(form);
      return;
    }

    const postButton = document.getElementById('post-button');
    postButton.disabled = true;
    window.SiteDB.create('messages', window.SiteDB.docId(author), { name: author, body, createdAt: Date.now() })
      .then(() => loadMessages().then(() => finishPost(form)))
      .catch(() => {
        // Either someone just took the name, or something broke: reload the wall and check.
        loadMessages().then(() => {
          statusElement.textContent = messages.some(message => nameKey(message.author || '') === nameKey(author)) ? copy.duplicate : copy.postError;
        });
      })
      .finally(() => { postButton.disabled = false; });
  });

  messagesElement.addEventListener('click', event => {
    const button = event.target.closest('[data-delete-id]');
    if (!button) return;
    const id = button.dataset.deleteId;
    if (!remote) {
      messages = messages.filter(message => message.id !== id);
      saveLocal();
      statusElement.textContent = copy.removed;
      render();
      return;
    }
    button.disabled = true;
    window.SiteDB.remove('messages', id)
      .then(() => { statusElement.textContent = copy.removed; return loadMessages(); })
      .catch(() => { button.disabled = false; statusElement.textContent = copy.postError; });
  });

  const clearButton = document.getElementById('clear-button');
  clearButton.hidden = remote; // clearing a shared wall in one click is too easy to do by accident
  clearButton.addEventListener('click', () => {
    if (!messages.length || !window.confirm(copy.confirm)) return;
    messages = [];
    saveLocal();
    statusElement.textContent = copy.cleared;
    render();
  });

  // ---- owner login (shared wall only) ----
  if (remote) {
    document.getElementById('owner-area').hidden = false;
    function refreshOwnerUi() {
      const loggedIn = window.SiteDB.isOwner();
      ownerToggle.textContent = loggedIn ? copy.logout : copy.owner;
    }
    refreshOwnerUi();
    ownerToggle.addEventListener('click', () => {
      if (window.SiteDB.isOwner()) {
        window.SiteDB.logout();
        ownerForm.hidden = true;
        refreshOwnerUi();
        render();
      } else {
        ownerForm.hidden = !ownerForm.hidden;
        if (!ownerForm.hidden) document.getElementById('owner-email').focus();
      }
    });
    ownerForm.addEventListener('submit', event => {
      event.preventDefault();
      ownerStatus.textContent = '';
      window.SiteDB.login(document.getElementById('owner-email').value.trim(), document.getElementById('owner-password').value)
        .then(() => {
          document.getElementById('owner-password').value = '';
          ownerForm.hidden = true;
          refreshOwnerUi();
          statusElement.textContent = copy.loggedIn;
          render();
        })
        .catch(() => { ownerStatus.textContent = copy.loginError; });
    });
  }

  countElement.textContent = remote ? copy.loading : '';
  loadMessages();
</script>
</body>
</html>
